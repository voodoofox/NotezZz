<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4f5f7" />
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/icon-192.png" />
    <script>
      // Apply the cached theme before first paint — no light flash, no delay.
      try {
        var s = JSON.parse(localStorage.getItem('notezzz:cache:settings') || 'null');
        if (s && s.appTheme) document.documentElement.dataset.theme = s.appTheme;
      } catch (e) {}
    </script>
    <title>NotezZz</title>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
