<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <!-- interactive-widget=resizes-content: the Android keyboard RESIZES the
         page instead of overlaying it, so the bottom toolbar stays visible
         right above the keyboard (incl. extra keyboard bars like SwiftKey's). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, interactive-widget=resizes-content"
    />
    <!-- Installed on Android, the status bar colour comes from the manifest,
         not from this tag — so both are dark, matching the app's own top bar.
         This tag still drives the browser-tab colour and is kept in step with
         the chosen theme by the script below. -->
    <meta name="theme-color" content="#16181d" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/icon-192.png" />
    <script>
      // Apply the cached theme before first paint — no light flash, no delay.
      // The theme-color is set here too: on an installed PWA it colours the
      // Android status bar, which otherwise stays at the manifest's light
      // value while the app itself is dark.
      try {
        var s = JSON.parse(localStorage.getItem('notezzz:cache:settings') || 'null');
        var t = (s && s.appTheme) || (localStorage.getItem('notezzz:settings')
          ? (JSON.parse(localStorage.getItem('notezzz:settings')).appTheme) : null);
        if (t) {
          document.documentElement.dataset.theme = t;
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', t === 'dark' ? '#16181d' : '#f4f5f7');
        }
      } catch (e) {}
    </script>
    <title>NotezZz</title>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
